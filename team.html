<!DOCTYPE html>
<html lang="en" data-theme="specimen">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team — Liu Lab @ MCW</title>
  <meta name="description" content="iPSC-Perturbation Lab at the Medical College of Wisconsin. We use induced pluripotent stem cells and CRISPR screens to decode cardiovascular disease." />
  <link rel="icon" href="favicon.png" />
  <script>
    (function () {
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('liu.theme') || 'specimen');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=site-copy-20260531" />
</head>
<body data-theme="specimen">
  <script>
    (function () {
      try {
        document.body.setAttribute('data-theme', localStorage.getItem('liu.theme') || 'specimen');
      } catch (e) {}
    })();
  </script>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <script src="data.js?v=site-copy-20260531"></script>
  <script src="image-slot.js"></script>
  <script src="particles.js"></script>
  <script src="components.js"></script>
  <script src="pages.js?v=site-copy-20260531"></script>

  <script>
    const e = React.createElement;

    function Site() {
      const [page, setPage] = React.useState('team');

      // Navigate to a different page = full page load (each page is a real .html file)
      const navigate = (target) => {
        const map = {
          home: 'index.html',
          research: 'research.html',
          team: 'team.html',
          publications: 'publications.html',
          contact: 'contact.html'
        };
        if (target !== 'team') window.location.href = map[target];
      };

      const goResearch = (projectId) => {
        sessionStorage.setItem('liu.targetProject', projectId);
        window.location.href = 'research.html';
      };

      // Pick up cross-page research target on load
      const [targetProject, setTargetProject] = React.useState(() => {
        if (false) {
          const t = sessionStorage.getItem('liu.targetProject');
          if (t) sessionStorage.removeItem('liu.targetProject');
          return t || null;
        }
        return null;
      });

      return e(React.Fragment, null,
        e(Nav, { page: 'team', setPage: navigate, theme: 'specimen', setTheme: () => {} }),
        e('main', null,
          e(TeamPage, { theme: 'specimen' })
        ),
        e(Footer, null)
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(Site));
  </script>
</body>
</html>
